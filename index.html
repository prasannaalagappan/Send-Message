<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Message Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">Service Apply</p>
          <h1>Dashboard</h1>
        </div>
        <div class="status-pill" id="statusPill">Ready</div>
      </section>

      <section class="workspace">
        <form class="panel form-panel" id="serviceForm">
          <div class="field">
            <label for="device">Category</label>
            <select id="device" name="device">
              <option value="laptop">Laptop</option>
              <option value="screen">Screen</option>
            </select>
          </div>

          <div class="field">
            <label for="issue">Status</label>
            <select id="issue" name="issue"></select>
          </div>

          <div class="two-column">
            <div class="field">
              <label for="numberOne">Number 1</label>
              <input id="numberOne" name="numberOne" type="tel" inputmode="tel" placeholder="+91 98765 43210" />
            </div>
            <div class="field">
              <label for="numberTwo">Number 2</label>
              <input id="numberTwo" name="numberTwo" type="tel" inputmode="tel" placeholder="+91 98765 43210" />
            </div>
          </div>

          <div class="field">
            <label for="customerName">Name</label>
            <input id="customerName" name="customerName" type="text" placeholder="Customer name" />
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5"></textarea>
          </div>

          <section class="media-box" aria-label="Photo attachment">
            <div class="media-title">
              <div>
                <p class="eyebrow">Photo</p>
                <h2>Camera / File</h2>
              </div>
              <button class="ghost-button small" type="button" id="clearPhoto">Clear</button>
            </div>

            <div class="media-actions">
              <button type="button" id="cameraBtn">Open Camera</button>
              <label class="file-button" for="photoInput">Choose File</label>
              <input id="photoInput" type="file" accept="image/*" />
            </div>

            <div class="camera-wrap" id="cameraWrap" hidden>
              <video id="cameraVideo" autoplay playsinline></video>
              <button type="button" id="captureBtn">Take Photo</button>
            </div>

            <figure class="photo-preview" id="photoPreview" hidden>
              <img id="photoImage" alt="Selected service photo preview" />
              <figcaption id="photoName">No photo selected</figcaption>
            </figure>

            <div class="share-row">
              <button type="button" id="sharePhoto">Share Photo</button>
            </div>
          </section>

          <div class="action-row">
            <button class="ghost-button" type="button" id="resetBtn">Reset</button>
            <button class="primary-button" type="submit">Send to Both</button>
          </div>
        </form>

        <aside class="panel preview-panel">
          <div class="preview-head">
            <p class="eyebrow">Live Preview</p>
            <span id="selectedBadge">Laptop Screen</span>
          </div>
          <div class="phone-preview">
            <div class="phone-top"></div>
            <div class="chat-bubble" id="previewMessage"></div>
            <img class="chat-photo" id="previewPhoto" alt="Attached photo preview" hidden />
          </div>
          <div class="quick-actions">
            <button type="button" id="sendFirst">Send Number 1</button>
            <button type="button" id="sendSecond">Send Number 2</button>
          </div>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
