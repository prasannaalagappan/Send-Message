<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise IT Solutions | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316; /* Orange Primary */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 { font-size: 24px; margin-bottom: 25px; font-weight: 600; }
        h2 span { color: #facc15; } /* Yellow span */

        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }

        /* Dropdown Colors - Neenga ketta maari Red/Orange/Yellow theme */
        select {
            width: 100%;
            padding: 12px;
            background: #ef4444; /* Red Background */
            border: 1px solid #f97316; /* Orange Border */
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-weight: 600;
            appearance: none; /* Custom styling support */
        }

        /* Option items color (Note: browser behavior vary aagum) */
        select option {
            background: #f97316; /* Orange options */
            color: #fff;
        }

        #subStatus {
            background: #f59e0b; /* Yellow/Orange for Status */
        }

        .upload-area {
            border: 2px dashed #facc15;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            background: rgba(250, 204, 21, 0.05);
            margin-bottom: 20px;
        }

        #preview { width: 100%; border-radius: 10px; margin-top: 10px; display: none; }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #ef4444, #f97316);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
            margin-bottom: 10px;
        }

        #dashboard-section { display: none; }
        .success-overlay { display: none; margin-top: 20px; padding: 12px; background: rgba(34, 197, 94, 0.2); color: #4ade80; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="glass-card" id="login-section">
        <h2>IT <span>Login</span></h2>
        <div class="input-group">
            <label>ID</label>
            <input type="text" id="username" placeholder="Admin" style="width:100%; padding:12px; border-radius:10px; border:none; background:rgba(255,255,255,0.1); color:white;">
        </div>
        <div class="input-group">
            <label>PIN</label>
            <input type="password" id="password" placeholder="••••" style="width:100%; padding:12px; border-radius:10px; border:none; background:rgba(255,255,255,0.1); color:white;">
        </div>
        <button class="btn" onclick="handleLogin()">Login</button>
    </div>

    <div class="glass-card" id="dashboard-section">
        <h2>Asset <span>Reporter</span></h2>
        
        <div class="input-group">
            <label>1. Device</label>
            <select id="mainDevice" onchange="updateOptions()">
                <option value="">-- Choose Hardware --</option>
                <option value="Laptop">Laptop</option>
                <option value="Screen">External Screen</option>
            </select>
        </div>

        <div class="input-group">
            <label>2. Capture Photo</label>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p id="upload-text" style="font-size: 12px;">📸 Tap to OPEN CAMERA</p>
                <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" onchange="previewImage()">
                <img id="preview">
            </div>
        </div>

        <div class="input-group">
            <label>3. Issue Status</label>
            <select id="subStatus">
                <option value="">-- Waiting --</option>
            </select>
        </div>

        <button class="btn" onclick="sendDirectMessage()">Send WhatsApp Report</button>
        <p style="font-size: 10px; color: #94a3b8;">Note: Browser settings-la camera 'Allow' panni irukanum.</p>
        <div class="success-overlay" id="msgDone">WhatsApp Triggered! ✅</div>
    </div>

<script>
    const TARGET_NUMBERS = ["917708309021"]; 

    function handleLogin() {
        if(document.getElementById("username").value === "admin" && document.getElementById("password").value === "1234") {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("dashboard-section").style.display = "block";
        } else { alert("Error!"); }
    }

    function updateOptions() {
        const main = document.getElementById("mainDevice").value;
        const sub = document.getElementById("subStatus");
        sub.innerHTML = "";
        let opts = main === "Laptop" ? ["Broken Screen", "Dead Battery", "Water Damage"] : ["No Signal", "Lines in Display", "HDMI Fail"];
        opts.forEach(o => {
            let el = document.createElement("option");
            el.textContent = o; el.value = o; sub.appendChild(el);
        });
    }

    function previewImage() {
        const file = document.getElementById('fileInput').files[0];
        const preview = document.getElementById('preview');
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; }
            reader.readAsDataURL(file);
        }
    }

    function sendDirectMessage() {
        const device = document.getElementById("mainDevice").value;
        const status = document.getElementById("subStatus").value;
        const msg = `🚀 IT REPORT\nDevice: ${device}\nIssue: ${status}\nPhoto Captured: Yes`;

        TARGET_NUMBERS.forEach((num, i) => {
            const url = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
            setTimeout(() => { window.open(url, '_blank'); }, i * 1500);
        });
        document.getElementById("msgDone").style.display = "block";
    }
</script>
</body>
</html>
