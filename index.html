<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Enterprise | Outlook Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ef4444; /* Red */
            --secondary: #f97316; /* Orange */
            --accent: #facc15; /* Yellow */
            --outlook: #0078d4; /* Outlook Blue */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            color: #fff; padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; border-radius: 24px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 { margin-bottom: 25px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        h2 span { color: var(--accent); }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }

        /* Login Inputs */
        .login-input {
            width: 100%; padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: #fff; margin-bottom: 15px; outline: none;
        }

        /* DROPDOWN COLOR THEME - FIXING WHITE SPACE */
        select {
            width: 100%; padding: 14px;
            background-color: var(--primary) !important;
            color: white !important;
            border: 2px solid var(--secondary);
            border-radius: 12px; font-weight: 600; outline: none;
            cursor: pointer;
        }
        select option { background: var(--secondary); color: white; padding: 10px; }

        /* CAMERA BOX */
        .upload-area {
            border: 2px dashed var(--accent);
            padding: 25px; border-radius: 18px;
            cursor: pointer; background: rgba(250, 204, 21, 0.05);
            margin-bottom: 20px; transition: 0.3s;
        }
        .upload-area:hover { background: rgba(250, 204, 21, 0.1); }
        #preview { width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 2px solid var(--secondary); }

        .btn {
            width: 100%; padding: 16px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
            transition: 0.3s;
        }
        .btn-outlook {
            background: linear-gradient(to right, var(--outlook), #28a8ea);
            box-shadow: 0 10px 20px rgba(0, 120, 212, 0.3);
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        #dashboard-section { display: none; }
    </style>
</head>
<body>

    <div class="glass-card" id="login-section">
        <h2>IT <span>Login</span></h2>
        <div class="input-group">
            <label>Employee ID</label>
            <input type="text" id="username" class="login-input" placeholder="admin">
        </div>
        <div class="input-group">
            <label>Security PIN</label>
            <input type="password" id="password" class="login-input" placeholder="••••">
        </div>
        <button class="btn" onclick="handleLogin()">ACCESS DASHBOARD</button>
    </div>

    <div class="glass-card" id="dashboard-section">
        <h2 style="color: #28a8ea;">Asset <span>Reporter</span></h2>
        
        <div class="input-group">
            <label>1. Select Hardware</label>
            <select id="mainDevice" onchange="updateOptions()">
                <option value="">-- CHOOSE DEVICE --</option>
                <option value="Laptop">Laptop</option>
                <option value="Screen">External Screen</option>
            </select>
        </div>

        <div class="input-group">
            <label>2. Device Evidence (Camera)</label>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p id="upload-text" style="font-size: 13px; color: var(--accent);">📸 TAP TO OPEN CAMERA</p>
                <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" onchange="previewImage(this)">
                <img id="preview">
            </div>
        </div>

        <div class="input-group">
            <label>3. Current Status</label>
            <select id="subStatus">
                <option value="">-- WAITING --</option>
            </select>
        </div>

        <button class="btn btn-outlook" onclick="sendToOutlook()">SEND REPORT TO OUTLOOK</button>
        <p style="font-size: 10px; color: #94a3b8; margin-top:15px;">
            Note: Photo capture pannavudane automatic-ah copy aayidum. <br>
            Outlook-la <b>Paste (Ctrl+V)</b> panna photo attachment-ah theriyum.
        </p>
    </div>

<script>
    // Login Logic
    function handleLogin() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        if(u === "admin" && p === "1234") {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("dashboard-section").style.display = "block";
        } else {
            alert("Security Alert: Invalid Credentials!");
        }
    }

    // Dropdown Logic
    function updateOptions() {
        const main = document.getElementById("mainDevice").value;
        const sub = document.getElementById("subStatus");
        sub.innerHTML = "";
        let opts = main === "Laptop" ? ["Keyboard Damage", "Screen Crack", "Battery Issue", "OS Failure"] : ["No Display", "HDMI Port Loose", "Screen Flickering"];
        opts.forEach(o => {
            let el = document.createElement("option");
            el.textContent = o; el.value = o; sub.appendChild(el);
        });
    }

    // Photo Capture & Clipboard Logic
    async function previewImage(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = async (e) => { 
                document.getElementById('preview').src = e.target.result; 
                document.getElementById('preview').style.display = 'block'; 
                document.getElementById('upload-text').innerText = "✅ PHOTO READY TO PASTE";
                
                // Copy to Clipboard immediately
                try {
                    const item = new ClipboardItem({ [file.type]: file });
                    await navigator.clipboard.write([item]);
                } catch (err) { console.log("Clipboard Copy Failed"); }
            }
            reader.readAsDataURL(file);
        }
    }

    // Outlook Send Logic
    function sendToOutlook() {
        const device = document.getElementById("mainDevice").value;
        const status = document.getElementById("subStatus").value;
        
        if(!device || !status) { alert("Please complete all steps!"); return; }

        const recipient = "prasanna@d-cube.in"; // Inga unga email kudunga
        const subject = encodeURIComponent(`IT ALERT: ${device} - ${status}`);
        const body = encodeURIComponent(
            `💠 IT ALERT REPORT\n` +
            `--------------------------\n` +
            `📍 Device: ${device}\n` +
            `⚠️ Status: ${status}\n` +
            `📸 Evidence: Attached (Please PASTE here)\n` +
            `--------------------------\n\n` +
            `[ADMIN NOTE: Photo copy aayirukku, just Paste panna view aagum]`
        );

        window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
    }
</script>
</body>
</html>
