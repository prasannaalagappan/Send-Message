<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise IT Solutions | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #6366f1;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Container with Glass effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 24px;
            width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 { font-size: 28px; margin-bottom: 30px; letter-spacing: 1px; font-weight: 600; }
        h2 span { color: var(--secondary); }

        .input-group { text-align: left; margin-bottom: 25px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

        input, select {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Modern Gradient Button */
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #4f46e5, #818cf8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.5);
            filter: brightness(1.1);
        }

        /* Status & Layout control */
        #dashboard-section { display: none; }
        
        .success-overlay {
            display: none;
            margin-top: 20px;
            padding: 10px;
            background: rgba(34, 197, 94, 0.2);
            border-radius: 8px;
            border: 1px solid #22c55e;
            color: #4ade80;
            font-size: 14px;
        }

        select option { background: #1e1b4b; color: #fff; }
    </style>
</head>
<body>

    <div class="glass-card" id="login-section">
        <h2>IT <span>Login</span></h2>
        <div class="input-group">
            <label>Employee ID</label>
            <input type="text" id="username" placeholder="Username">
        </div>
        <div class="input-group">
            <label>Security Key</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn" onclick="handleLogin()">Access Dashboard</button>
    </div>

    <div class="glass-card" id="dashboard-section">
        <h2><span>Asset</span> Manager</h2>
        
        <div class="input-group">
            <label>Hardware Device</label>
            <select id="mainDevice" onchange="updateOptions()">
                <option value="">-- Select Item --</option>
                <option value="Laptop">Laptop</option>
                <option value="Screen">Screen</option>
            </select>
        </div>

        <div class="input-group">
            <label>Maintenance Status</label>
            <select id="subStatus">
                <option value="">-- Choose Status --</option>
            </select>
        </div>

        <button class="btn" onclick="sendDirectMessage()">Execute Notification</button>
        <div class="success-overlay" id="msgDone">Notification Dispatched Successfully!</div>
    </div>

<script>
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "1234";
    const TARGET_NUMBERS = ["917708309021"]; // Change to your numbers

    function handleLogin() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;

        if(u === ADMIN_USER && p === ADMIN_PASS) {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("dashboard-section").style.display = "block";
        } else {
            alert("Security Breach: Invalid Credentials!");
        }
    }

    function updateOptions() {
        const main = document.getElementById("mainDevice").value;
        const sub = document.getElementById("subStatus");
        sub.innerHTML = "";

        let options = [];
        if (main === "Laptop") {
            options = ["Laptop Screen Check", "Laptop Functional", "Hardware Failure"];
        } else if (main === "Screen") {
            options = ["Screen Active", "Screen Inactive"];
        }

        options.forEach(opt => {
            let el = document.createElement("option");
            el.textContent = opt;
            el.value = opt;
            sub.appendChild(el);
        });
    }

    function sendDirectMessage() {
        const device = document.getElementById("mainDevice").value;
        const status = document.getElementById("subStatus").value;

        if(!device || !status) {
            alert("Selection required!");
            return;
        }

        const msg = `[IT-ALERT] ${device} status changed to: ${status}`;

        TARGET_NUMBERS.forEach((num, index) => {
            const url = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
            setTimeout(() => {
                window.open(url, '_blank');
            }, index * 1200); 
        });

        document.getElementById("msgDone").style.display = "block";
        setTimeout(() => {
            document.getElementById("msgDone").style.display = "none";
        }, 4000);
    }
</script>

</body>
</html>
