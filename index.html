<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise IT Solutions | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 { font-size: 24px; margin-bottom: 25px; font-weight: 600; }
        h2 span { color: var(--primary); }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #000;
            font-size: 14px;
            outline: none;
        }

        /* Image Upload Box - Modern Look */
        .upload-area {
            border: 2px dashed rgba(99, 102, 241, 0.3);
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            position: relative;
        }
        .upload-area:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.08); }
        #preview { width: 100%; border-radius: 10px; margin-top: 10px; display: none; object-fit: cover; max-height: 200px; }
        
        .upload-icon { font-size: 24px; margin-bottom: 8px; display: block; }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #4f46e5, #818cf8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        #dashboard-section { display: none; }
        .success-overlay { display: none; margin-top: 20px; padding: 12px; background: rgba(34, 197, 94, 0.15); color: #4ade80; border-radius: 10px; border: 1px solid #22c55e; font-size: 14px; }
    </style>
</head>
<body>

    <div class="glass-card" id="login-section">
        <h2>IT <span>Portal</span> Login</h2>
        <div class="input-group">
            <label>Access ID</label>
            <input type="text" id="username" placeholder="Enter Username">
        </div>
        <div class="input-group">
            <label>Security Pin</label>
            <input type="password" id="password" placeholder="••••">
        </div>
        <button class="btn" onclick="handleLogin()">Unlock Dashboard</button>
    </div>

    <div class="glass-card" id="dashboard-section">
        <h2><span>Asset</span> Reporter</h2>
        
        <div class="input-group">
            <label>1. Select Device</label>
            <select id="mainDevice" onchange="updateOptions()">
                <option value="">-- Choose Hardware --</option>
                <option value="Laptop">Laptop</option>
                <option value="Screen">External Screen</option>
            </select>
        </div>

        <div class="input-group">
            <label>2. Device Evidence (Photo)</label>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <span class="upload-icon">📸</span>
                <p id="upload-text" style="font-size: 12px; color: #94a3b8;">Tap to Capture or Upload Image</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImage()">
                <img id="preview" alt="Preview Image">
            </div>
        </div>

        <div class="input-group">
            <label>3. Issue Category</label>
            <select id="subStatus">
                <option value="">-- Waiting for Selection --</option>
            </select>
        </div>

        <button class="btn" onclick="sendDirectMessage()">Submit IT Report</button>
        <div class="success-overlay" id="msgDone">Report Logged & WhatsApp Notified! ✅</div>
    </div>

<script>
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "1234";
    const TARGET_NUMBERS = ["917708309021"]; // Change to yours

    function handleLogin() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        if(u === ADMIN_USER && p === ADMIN_PASS) {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("dashboard-section").style.display = "block";
        } else { alert("Access Denied!"); }
    }

    function updateOptions() {
        const main = document.getElementById("mainDevice").value;
        const sub = document.getElementById("subStatus");
        sub.innerHTML = "";
        
        let options = [];
        if (main === "Laptop") {
            options = ["OS Crash", "Battery Swollen", "Keyboard Damage", "Display Crack"];
        } else if (main === "Screen") {
            options = ["Power No LED", "Horizontal Lines", "Color Distortion", "HDMI Port Loose"];
        } else {
            options = ["Please select device first"];
        }

        options.forEach(opt => {
            let el = document.createElement("option");
            el.textContent = opt; el.value = opt; sub.appendChild(el);
        });
    }

    function previewImage() {
        const file = document.getElementById('fileInput').files[0];
        const preview = document.getElementById('preview');
        const text = document.getElementById('upload-text');
        const icon = document.querySelector('.upload-icon');
        
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                text.style.display = 'none';
                icon.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    function sendDirectMessage() {
        const device = document.getElementById("mainDevice").value;
        const status = document.getElementById("subStatus").value;
        
        if(!device || !status) { alert("Selection missing!"); return; }

        const msg = `🚀 *IT ALERT REPORT*\n----------------------\n📍 *Device:* ${device}\n⚠️ *Status:* ${status}\n📸 *Evidence:* Photo captured on dashboard.`;

        TARGET_NUMBERS.forEach((num, index) => {
            const url = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
            setTimeout(() => { window.open(url, '_blank'); }, index * 1200); 
        });

        document.getElementById("msgDone").style.display = "block";
    }
</script>

</body>
</html>
